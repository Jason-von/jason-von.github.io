<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Battery Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            width: 350px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .info {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .label { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #111; }
        .error { color: #dc3545; font-size: 14px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Battery Monitor</h2>
    <button id="connectBtn">Connect to AirPods</button>

    <div class="info">
        <div class="label">Device Name</div>
        <div id="deviceName" class="value">Not Connected</div>

        <div class="label">Battery Level</div>
        <div id="batteryLevel" class="value">--</div>
    </div>
    
    <div id="errorLog" class="error"></div>
</div>

<script>
document.getElementById('connectBtn').addEventListener('click', async () => {
    const nameEl = document.getElementById('deviceName');
    const batteryEl = document.getElementById('batteryLevel');
    const errorEl = document.getElementById('errorLog');
    
    errorEl.innerText = "";
    nameEl.innerText = "Scanning...";
    batteryEl.innerText = "--";

    try {
        // 1. Broaden the filter so AirPods can be discovered
        // We look for any device named "AirPods" or we can accept all devices
        const device = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'AirPods' } 
            ],
            // This tells the browser it's allowed to interact with standard profiles if they exist
            optionalServices: ['battery_service', 'generic_access'] 
        });

        nameEl.innerText = device.name || "Unknown AirPods";
        log("Connected to device object. Attempting GATT connection...");

        // 2. Connect to the device
        const server = await device.gatt.connect();
        
        // 3. Attempt to read standard battery (Note: This may fail on certain AirPods models/firmwares)
        try {
            const service = await server.getPrimaryService('battery_service');
            const characteristic = await service.getCharacteristic('battery_level');
            const value = await characteristic.readValue();
            const batteryPercent = value.getUint8(0);
            batteryEl.innerText = batteryPercent + "%";
        } catch (gattErr) {
            console.log(gattErr);
            batteryEl.innerText = "Unavailable via GATT";
            errorEl.innerText = "Connected! However, Apple blocks standard GATT battery reading on this model. AirPods rely on BLE Advertisements instead.";
        }

    } catch (error) {
        nameEl.innerText = "Error";
        errorEl.innerText = error.message;
    }
});
</script>

</body>
</html>
