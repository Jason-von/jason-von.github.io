<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Battery Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            width: 350px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .info {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .label { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #111; }
        .error { color: #dc3545; font-size: 14px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Battery Monitor</h2>
    <button id="connectBtn">Connect to AirPods</button>

    <div class="info">
        <div class="label">Device Name</div>
        <div id="deviceName" class="value">Not Connected</div>

        <div class="label">Battery Level</div>
        <div id="batteryLevel" class="value">--</div>
    </div>
    
    <div id="errorLog" class="error"></div>
</div>

<script>
document.getElementById('connectBtn').addEventListener('click', async () => {
    const nameEl = document.getElementById('deviceName');
    const batteryEl = document.getElementById('batteryLevel');
    const errorEl = document.getElementById('errorLog');
    
    // Clear previous states
    errorEl.innerText = "";
    nameEl.innerText = "Connecting...";
    batteryEl.innerText = "--";

    try {
        // 1. Request the device filtering for audio/battery services
        const device = await navigator.bluetooth.requestDevice({
            filters: [
                { services: ['battery_service'] }
            ],
            optionalServices: ['generic_access']
        });

        nameEl.innerText = device.name || "Unknown Device";

        // 2. Connect to the GATT Server
        const server = await device.gatt.connect();

        // 3. Get the Battery Service
        const service = await server.getPrimaryService('battery_service');

        // 4. Get the Battery Level Characteristic
        const characteristic = await service.getCharacteristic('battery_level');

        // 5. Read the value (returns an array with 1 byte representing 0-100%)
        const value = await characteristic.readValue();
        const batteryPercent = value.getUint8(0);

        batteryEl.innerText = batteryPercent + "%";

        // Optional: Listen for live updates if the battery level changes
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', (event) => {
            const updatedValue = event.target.value.getUint8(0);
            batteryEl.innerText = updatedValue + "%";
        });

    } catch (error) {
        nameEl.innerText = "Error";
        errorEl.innerText = error.message;
    }
});
</script>

</body>
</html>
